# /etc/nginx/sites-available/tradepulse-backend
# symlink into sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# Run certbot afterwards to add the HTTPS server block automatically:
#   sudo certbot --nginx -d api.yourdomain.com

server {
    listen 80;
    server_name api.yourdomain.com;  # replace with your domain, or the VM's public IP

    client_max_body_size 10M;

    location / {
        proxy_pass http://unix:/run/tradepulse-backend.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, not append (audit fix — L5 follow-up): $proxy_add_x_forwarded_for
        # appends $remote_addr to whatever X-Forwarded-For the CLIENT already sent,
        # so a request with a spoofed XFF header arrived at the app as
        # "<attacker-supplied>, <real ip>" — and the app's own lockout middleware
        # trusted the first (attacker-controlled) entry, making the brute-force
        # lockout on /admin/login/ fully bypassable. This nginx sits directly on the
        # public internet with no proxy in front of it, so $remote_addr IS the real
        # client IP — there is nothing legitimate to append to.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
